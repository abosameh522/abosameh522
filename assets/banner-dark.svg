<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Ahmed Sameh — aspiring Data Engineer and Analyst. Batch pipelines, checked schemas, honest evaluation.">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2B3A4F" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
    <linearGradient id="sig" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .t{fill:#E6EDF5}.m{fill:#93A4B7}
      .cyan{fill:#36C5D8}.bronze{fill:#D99245}.silver{fill:#9CB0C3}.gold{fill:#F2C14E}.violet{fill:#A78BFA}.ok{fill:#47C78B}
      .card{fill:#121A2A;stroke:#2B3A4F;stroke-width:1.5}
      .wire{fill:none;stroke:#2B3A4F;stroke-width:1.5;stroke-opacity:0.6}
      @keyframes flow272{to{stroke-dashoffset:-272}}
      @keyframes flow120{to{stroke-dashoffset:-120}}
      @keyframes flow50{to{stroke-dashoffset:-50}}
      @keyframes flow70{to{stroke-dashoffset:-70}}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}
      .p272{stroke-dasharray:8 264;animation:flow272 6s linear infinite}
      .p120{stroke-dasharray:6 114;animation:flow120 2.6s linear infinite}
      .p50{stroke-dasharray:6 44;animation:flow50 1.8s linear infinite}
      .p70{stroke-dasharray:6 64;animation:flow70 2.2s linear infinite}
      .pulse{animation:pulse 3s ease-in-out infinite}
      .d1{animation-delay:-0.9s}.d2{animation-delay:-1.8s}.d3{animation-delay:-0.5s}.d4{animation-delay:-1.4s}
      @media (prefers-reduced-motion:reduce){.p272,.p120,.p50,.p70,.pulse{animation:none}}
    </style>
  </defs>

  <rect width="1200" height="320" rx="16" fill="#0B1020"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="15.25" fill="none" stroke="#2B3A4F" stroke-width="1.5"/>
  <path d="M16 1.5H1184" stroke="url(#sig)" stroke-width="3" stroke-linecap="round"/>

  <!-- faint background stream -->
  <path d="M620 278C760 246 820 96 980 84S1120 124 1172 62" class="wire" stroke-opacity="0.25"/>
  <path d="M620 278C760 246 820 96 980 84S1120 124 1172 62" fill="none" stroke="#36C5D8" stroke-width="1.5" stroke-opacity="0.3" class="p272"/>

  <!-- identity -->
  <text x="48" y="76" class="mono m" font-size="11" letter-spacing="1.5">BATCH DATA ENGINEERING · ANALYTICS</text>
  <text x="48" y="134" class="sans t" font-size="46" font-weight="800" letter-spacing="-0.5">Ahmed Sameh</text>
  <rect x="48" y="156" width="4" height="20" rx="2" class="cyan"/>
  <text x="64" y="172" class="mono cyan" font-size="16" font-weight="700">Aspiring Data Engineer &amp; Analyst</text>
  <text x="48" y="206" class="sans m" font-size="13.5">Reliable batch pipelines, checked schemas, honest evaluation.</text>
  <text x="48" y="238" class="mono m" font-size="12">@abosameh522</text>
  <rect x="48" y="254" width="282" height="26" rx="13" fill="#121A2A" stroke="#47C78B" stroke-width="1"/>
  <circle cx="64" cy="267" r="3.5" class="ok pulse"/>
  <text x="76" y="271" class="mono ok" font-size="10.5" font-weight="700">OPEN TO DATA ENGINEER &amp; ANALYST ROLES</text>

  <!-- pipeline motif -->
  <g>
    <circle cx="660" cy="120" r="5" class="cyan pulse"/>
    <circle cx="660" cy="170" r="5" class="cyan pulse d1"/>
    <circle cx="660" cy="220" r="5" class="cyan pulse d2"/>
    <path d="M665 120C700 120 720 170 760 170" class="wire"/>
    <path d="M665 170H760" class="wire"/>
    <path d="M665 220C700 220 720 170 760 170" class="wire"/>
    <path d="M665 120C700 120 720 170 760 170" fill="none" stroke="#D99245" stroke-width="1.5" class="p120"/>
    <path d="M665 170H760" fill="none" stroke="#D99245" stroke-width="1.5" class="p120 d1"/>
    <path d="M665 220C700 220 720 170 760 170" fill="none" stroke="#D99245" stroke-width="1.5" class="p120 d2"/>

    <rect x="760" y="150" width="56" height="40" rx="8" class="card" stroke="#D99245"/>
    <text x="788" y="174" text-anchor="middle" class="mono bronze" font-size="10" font-weight="700">BRONZE</text>
    <path d="M816 170H866" class="wire"/>
    <path d="M816 170H866" fill="none" stroke="#9CB0C3" stroke-width="1.5" class="p50"/>

    <polygon points="880,158 892,170 880,182 868,170" fill="#121A2A" stroke="#A78BFA" stroke-width="1.5"/>
    <polygon points="880,152 898,170 880,188 862,170" fill="none" stroke="#A78BFA" stroke-width="1" stroke-opacity="0.35" class="pulse d3"/>
    <text x="880" y="198" text-anchor="middle" class="mono violet" font-size="8.5" font-weight="700">GATE</text>
    <path d="M892 170H936" class="wire"/>
    <path d="M892 170H936" fill="none" stroke="#9CB0C3" stroke-width="1.5" class="p50 d1"/>

    <rect x="936" y="150" width="56" height="40" rx="8" class="card" stroke="#9CB0C3"/>
    <text x="964" y="174" text-anchor="middle" class="mono silver" font-size="10" font-weight="700">SILVER</text>
    <path d="M992 170H1036" class="wire"/>
    <path d="M992 170H1036" fill="none" stroke="#F2C14E" stroke-width="1.5" class="p50 d2"/>

    <rect x="1036" y="150" width="56" height="40" rx="8" class="card" stroke="#F2C14E"/>
    <text x="1064" y="174" text-anchor="middle" class="mono gold" font-size="10" font-weight="700">GOLD</text>
    <path d="M1092 170C1120 170 1120 120 1150 120" class="wire"/>
    <path d="M1092 170H1150" class="wire"/>
    <path d="M1092 170C1120 170 1120 220 1150 220" class="wire"/>
    <path d="M1092 170C1120 170 1120 120 1150 120" fill="none" stroke="#36C5D8" stroke-width="1.5" class="p70"/>
    <path d="M1092 170H1150" fill="none" stroke="#36C5D8" stroke-width="1.5" class="p70 d1"/>
    <path d="M1092 170C1120 170 1120 220 1150 220" fill="none" stroke="#36C5D8" stroke-width="1.5" class="p70 d2"/>
    <circle cx="1150" cy="120" r="4" class="cyan pulse d3"/>
    <circle cx="1150" cy="170" r="4" class="cyan pulse d4"/>
    <circle cx="1150" cy="220" r="4" class="cyan pulse"/>
    <text x="1150" y="136" text-anchor="middle" class="mono m" font-size="8">dash</text>
    <text x="1150" y="186" text-anchor="middle" class="mono m" font-size="8">api</text>
    <text x="1150" y="236" text-anchor="middle" class="mono m" font-size="8">sql</text>
  </g>
</svg>
