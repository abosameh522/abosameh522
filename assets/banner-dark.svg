<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Ahmed Sameh - Junior Data Engineer animated data pipeline banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#131C31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="engineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E293B" stroke-width="0.7" opacity="0.55"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect width="900" height="260" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #F8FAFC; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; fill: #CBD5E1; }
    .muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; fill: #94A3B8; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .pipe { fill: none; stroke: #334155; stroke-width: 2; stroke-dasharray: 5 5; animation: flow 1.8s linear infinite; }
    .pipe-out { fill: none; stroke: #38BDF8; stroke-width: 2; stroke-opacity: 0.45; stroke-dasharray: 6 5; animation: flow 1.5s linear infinite; }
    .pulse-dot { animation: pulse 2s ease-in-out infinite; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .bar1 { animation: eq 1.4s ease-in-out infinite; transform-origin: center bottom; }
    .bar2 { animation: eq 1.4s ease-in-out 0.25s infinite; transform-origin: center bottom; }
    .bar3 { animation: eq 1.4s ease-in-out 0.5s infinite; transform-origin: center bottom; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes eq { 0%, 100% { transform: scaleY(0.45); } 50% { transform: scaleY(1); } }
  </style>

  <g clip-path="url(#cardClip)">
    <!-- Background & Ambient Glows -->
    <rect width="900" height="260" fill="url(#bg)"/>
    <rect width="900" height="260" fill="url(#grid)"/>
    <circle cx="660" cy="110" r="190" fill="url(#glowCyan)"/>
    <circle cx="180" cy="40" r="160" fill="url(#glowPurple)"/>
    <rect x="0" y="0" width="900" height="3.5" fill="url(#accent)"/>

    <!-- LEFT SECTION: Identity -->
    <!-- Status Badge -->
    <rect x="38" y="30" width="308" height="26" rx="13" fill="#0F292E" stroke="#10B981" stroke-opacity="0.45" stroke-width="1"/>
    <circle cx="54" cy="43" r="4.5" fill="#10B981" class="pulse-dot" filter="url(#glow)"/>
    <text x="67" y="47" class="mono" font-size="10.5" font-weight="700" fill="#34D399" letter-spacing="0.7">JUNIOR DATA ENGINEER · OPEN TO WORK</text>

    <!-- Main Name -->
    <text x="38" y="106" class="title" font-size="40" letter-spacing="-0.6">Ahmed Sameh</text>
    <rect x="38" y="118" width="96" height="4" rx="2" fill="url(#accent)"/>

    <!-- Tagline -->
    <text x="38" y="148" class="sub" font-size="15">Building reliable ETL pipelines, clean data models</text>
    <text x="38" y="170" class="sub" font-size="15">&amp; quality-gated lakehouses from raw data to insight.</text>

    <!-- Meta Row -->
    <text x="38" y="198" class="muted" font-size="12.5">Cairo, Egypt  ·  CS &amp; AI '27  ·  @abosameh522</text>

    <!-- RIGHT SECTION: Animated Data Pipeline Visualization -->
    <rect x="478" y="24" width="388" height="184" rx="14" fill="#0B1324" fill-opacity="0.78" stroke="#1E293B" stroke-width="1.2"/>
    <text x="496" y="45" class="mono" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1.1">LIVE PIPELINE TOPOLOGY</text>
    <circle cx="848" cy="41" r="3.5" fill="#06B6D4" class="pulse-dot"/>
    <text x="838" y="45" class="mono" font-size="9.5" fill="#38BDF8" text-anchor="end">STREAMING</text>

    <!-- Pipe Paths (Sources -> ETL Engine) -->
    <path id="p1" d="M 556 80 C 590 80, 595 116, 632 116" class="pipe"/>
    <path id="p2" d="M 556 122 L 632 122" class="pipe"/>
    <path id="p3" d="M 556 164 C 590 164, 595 128, 632 128" class="pipe"/>

    <!-- Pipe Paths (ETL Engine -> Destinations) -->
    <path id="p4" d="M 730 112 C 756 112, 756 92, 778 92" class="pipe-out"/>
    <path id="p5" d="M 730 132 C 756 132, 756 152, 778 152" class="pipe-out"/>

    <!-- Animated Data Packets -->
    <circle r="3.8" fill="#F59E0B" filter="url(#glow)">
      <animateMotion dur="2.6s" repeatCount="indefinite" begin="0s">
        <mpath href="#p1"/>
      </animateMotion>
    </circle>
    <circle r="3.8" fill="#38BDF8" filter="url(#glow)">
      <animateMotion dur="2.1s" repeatCount="indefinite" begin="0.4s">
        <mpath href="#p2"/>
      </animateMotion>
    </circle>
    <circle r="3.8" fill="#10B981" filter="url(#glow)">
      <animateMotion dur="2.8s" repeatCount="indefinite" begin="0.9s">
        <mpath href="#p3"/>
      </animateMotion>
    </circle>
    <circle r="4" fill="#8B5CF6" filter="url(#glow)">
      <animateMotion dur="2.2s" repeatCount="indefinite" begin="0.3s">
        <mpath href="#p4"/>
      </animateMotion>
    </circle>
    <circle r="4" fill="#06B6D4" filter="url(#glow)">
      <animateMotion dur="2.4s" repeatCount="indefinite" begin="1.1s">
        <mpath href="#p5"/>
      </animateMotion>
    </circle>

    <!-- Source Nodes -->
    <g transform="translate(494, 64)">
      <rect width="62" height="32" rx="7" fill="#1E293B" stroke="#F59E0B" stroke-opacity="0.6" stroke-width="1"/>
      <text x="31" y="20" class="mono" font-size="11" font-weight="700" fill="#FCD34D" text-anchor="middle">APIs</text>
    </g>
    <g transform="translate(494, 106)">
      <rect width="62" height="32" rx="7" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="1"/>
      <text x="31" y="20" class="mono" font-size="11" font-weight="700" fill="#7DD3FC" text-anchor="middle">CSVs</text>
    </g>
    <g transform="translate(494, 148)">
      <rect width="62" height="32" rx="7" fill="#1E293B" stroke="#10B981" stroke-opacity="0.6" stroke-width="1"/>
      <text x="31" y="20" class="mono" font-size="11" font-weight="700" fill="#6EE7B7" text-anchor="middle">SQL DB</text>
    </g>

    <!-- Center ETL / Quality Node -->
    <g transform="translate(632, 82)">
      <rect width="98" height="80" rx="11" fill="url(#engineGrad)" stroke="#06B6D4" stroke-width="1.5"/>
      <text x="49" y="24" class="mono" font-size="11.5" font-weight="700" fill="#F8FAFC" text-anchor="middle">ETL / ELT</text>
      <text x="49" y="40" class="mono" font-size="9" fill="#38BDF8" text-anchor="middle">Quality Gates</text>
      <!-- Mini animated activity bars -->
      <rect x="33" y="50" width="6" height="18" rx="2" fill="#06B6D4" class="bar1"/>
      <rect x="46" y="46" width="6" height="22" rx="2" fill="#3B82F6" class="bar2"/>
      <rect x="59" y="52" width="6" height="16" rx="2" fill="#8B5CF6" class="bar3"/>
    </g>

    <!-- Destination Nodes -->
    <g transform="translate(778, 68)">
      <rect width="74" height="46" rx="8" fill="#1E1B4B" stroke="#8B5CF6" stroke-opacity="0.7" stroke-width="1.2"/>
      <text x="37" y="21" class="mono" font-size="10.5" font-weight="700" fill="#C4B5FD" text-anchor="middle">WAREHOUSE</text>
      <text x="37" y="36" class="mono" font-size="8.5" fill="#A78BFA" text-anchor="middle">Star Schema</text>
    </g>
    <g transform="translate(778, 128)">
      <rect width="74" height="46" rx="8" fill="#083344" stroke="#06B6D4" stroke-opacity="0.7" stroke-width="1.2"/>
      <text x="37" y="21" class="mono" font-size="10.5" font-weight="700" fill="#67E8F9" text-anchor="middle">LAKEHOUSE</text>
      <text x="37" y="36" class="mono" font-size="8.5" fill="#22D3EE" text-anchor="middle">Parquet</text>
    </g>

    <!-- Bottom Terminal Bar -->
    <rect x="38" y="218" width="828" height="28" rx="7" fill="#090F1D" stroke="#1E293B" stroke-width="1"/>
    <text x="52" y="236" class="mono" font-size="11" fill="#38BDF8">$</text>
    <text x="66" y="236" class="mono" font-size="11" fill="#CBD5E1">python -m pipeline.run --layer=bronze,silver,gold --validate=pandera</text>
    <rect x="522" y="226" width="7" height="12" fill="#06B6D4" class="cursor"/>
    <text x="852" y="236" class="mono" font-size="10.5" font-weight="700" fill="#34D399" text-anchor="end">[ ✓ ALL CHECKS PASS ]</text>
  </g>
  <rect x="0.75" y="0.75" width="898.5" height="258.5" rx="15.5" fill="none" stroke="#1E293B" stroke-width="1.5"/>
</svg>
