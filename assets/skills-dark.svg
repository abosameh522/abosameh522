<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Verified skills grouped into Languages, Data Engineering, Analytics and ML, and Tools. Only technologies used in the repositories.">
  <defs>
    <linearGradient id="swCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36C5D8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#36C5D8"/>
      <stop offset="100%" stop-color="#36C5D8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="swSilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9CB0C3" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9CB0C3"/>
      <stop offset="100%" stop-color="#9CB0C3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="swGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F2C14E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F2C14E"/>
      <stop offset="100%" stop-color="#F2C14E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="swViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip"><rect x="0" y="0" width="276" height="188" rx="12"/></clipPath>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .t{fill:#E6EDF5}.m{fill:#93A4B7}
      .card{fill:#121A2A;stroke:#2B3A4F;stroke-width:1.2}
      .chip{fill:#182337;stroke:#2B3A4F;stroke-width:1}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
      @keyframes sweep{0%{transform:translateX(-70px);opacity:0}10%{opacity:0.9}90%{opacity:0.9}100%{transform:translateX(286px);opacity:0}}
      .pulse{animation:pulse 3.2s ease-in-out infinite}
      .sweep{opacity:0;animation:sweep 7s linear infinite}
      .d1{animation-delay:-1.6s}.d2{animation-delay:-3.2s}.d3{animation-delay:-4.8s}
      @media (prefers-reduced-motion:reduce){.pulse,.sweep{animation:none}}
    </style>
  </defs>

  <rect width="1200" height="220" rx="16" fill="#0B1020"/>
  <rect x="0.75" y="0.75" width="1198.5" height="218.5" rx="15.25" fill="none" stroke="#2B3A4F" stroke-width="1.5"/>

  <!-- Languages -->
  <g transform="translate(24,16)">
    <rect width="276" height="188" rx="12" class="card"/>
    <g clip-path="url(#cardClip)"><rect x="0" y="0" width="70" height="2.5" fill="url(#swCyan)" class="sweep"/></g>
    <circle cx="16" cy="24" r="4" fill="#36C5D8" class="pulse"/>
    <text x="30" y="28" class="mono t" font-size="11.5" font-weight="700" letter-spacing="1">LANGUAGES</text>
    <rect x="14" y="44" width="248" height="22" rx="6" class="chip"/><text x="26" y="59" class="mono t" font-size="11">Python</text>
    <rect x="14" y="73" width="248" height="22" rx="6" class="chip"/><text x="26" y="88" class="mono t" font-size="11">SQL</text>
    <rect x="14" y="102" width="248" height="22" rx="6" class="chip"/><text x="26" y="117" class="mono t" font-size="11">HTML · Markdown</text>
    <rect x="14" y="131" width="248" height="22" rx="6" class="chip"/><text x="26" y="146" class="mono t" font-size="11">SVG (animated)</text>
    <text x="14" y="172" class="mono m" font-size="9.5">requires-python ≥3.10 / ≥3.11 / ≥3.12</text>
  </g>

  <!-- Data Engineering -->
  <g transform="translate(316,16)">
    <rect width="276" height="188" rx="12" class="card"/>
    <g clip-path="url(#cardClip)"><rect x="0" y="0" width="70" height="2.5" fill="url(#swSilver)" class="sweep d1"/></g>
    <circle cx="16" cy="24" r="4" fill="#9CB0C3" class="pulse d1"/>
    <text x="30" y="28" class="mono t" font-size="11.5" font-weight="700" letter-spacing="1">DATA ENGINEERING</text>
    <rect x="14" y="44" width="248" height="22" rx="6" class="chip"/><text x="26" y="59" class="mono t" font-size="11">PostgreSQL</text>
    <rect x="14" y="73" width="248" height="22" rx="6" class="chip"/><text x="26" y="88" class="mono t" font-size="11">DuckDB</text>
    <rect x="14" y="102" width="248" height="22" rx="6" class="chip"/><text x="26" y="117" class="mono t" font-size="11">Parquet · PyArrow</text>
    <rect x="14" y="131" width="248" height="22" rx="6" class="chip"/><text x="26" y="146" class="mono t" font-size="11">Prefect 3</text>
    <rect x="14" y="160" width="248" height="22" rx="6" class="chip"/><text x="26" y="175" class="mono t" font-size="11">Pandera</text>
  </g>

  <!-- Analytics / ML -->
  <g transform="translate(608,16)">
    <rect width="276" height="188" rx="12" class="card"/>
    <g clip-path="url(#cardClip)"><rect x="0" y="0" width="70" height="2.5" fill="url(#swGold)" class="sweep d2"/></g>
    <circle cx="16" cy="24" r="4" fill="#F2C14E" class="pulse d2"/>
    <text x="30" y="28" class="mono t" font-size="11.5" font-weight="700" letter-spacing="1">ANALYTICS / ML</text>
    <rect x="14" y="44" width="248" height="22" rx="6" class="chip"/><text x="26" y="59" class="mono t" font-size="11">pandas · NumPy</text>
    <rect x="14" y="73" width="248" height="22" rx="6" class="chip"/><text x="26" y="88" class="mono t" font-size="11">scikit-learn</text>
    <rect x="14" y="102" width="248" height="22" rx="6" class="chip"/><text x="26" y="117" class="mono t" font-size="11">XGBoost · LightGBM</text>
    <rect x="14" y="131" width="248" height="22" rx="6" class="chip"/><text x="26" y="146" class="mono t" font-size="11">Matplotlib · Plotly</text>
    <rect x="14" y="160" width="248" height="22" rx="6" class="chip"/><text x="26" y="175" class="mono t" font-size="11">Jupyter</text>
  </g>

  <!-- Tools -->
  <g transform="translate(900,16)">
    <rect width="276" height="188" rx="12" class="card"/>
    <g clip-path="url(#cardClip)"><rect x="0" y="0" width="70" height="2.5" fill="url(#swViolet)" class="sweep d3"/></g>
    <circle cx="16" cy="24" r="4" fill="#A78BFA" class="pulse d3"/>
    <text x="30" y="28" class="mono t" font-size="11.5" font-weight="700" letter-spacing="1">TOOLS</text>
    <rect x="14" y="44" width="248" height="22" rx="6" class="chip"/><text x="26" y="59" class="mono t" font-size="11">uv · pytest</text>
    <rect x="14" y="73" width="248" height="22" rx="6" class="chip"/><text x="26" y="88" class="mono t" font-size="11">Ruff · pre-commit</text>
    <rect x="14" y="102" width="248" height="22" rx="6" class="chip"/><text x="26" y="117" class="mono t" font-size="11">Docker Compose</text>
    <rect x="14" y="131" width="248" height="22" rx="6" class="chip"/><text x="26" y="146" class="mono t" font-size="11">FastAPI · Streamlit</text>
    <rect x="14" y="160" width="248" height="22" rx="6" class="chip"/><text x="26" y="175" class="mono t" font-size="11">GitHub Actions</text>
  </g>

  <text x="600" y="215" text-anchor="middle" class="mono m" font-size="9.5">only technologies used in the repositories — no roadmap tools</text>
</svg>
