<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Data Engineering Philosophy, Quality Gates and Live Pipeline Execution">
  <defs>
    <pattern id="tGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      @keyframes scanline {
        0% { transform: translateY(0px); opacity: 0.25; }
        50% { opacity: 0.55; }
        100% { transform: translateY(320px); opacity: 0.25; }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .dot-live { animation: pulseDot 2s infinite; }
    </style>
  </defs>

  <rect width="1200" height="400" rx="16" fill="#06080F"/>
  <rect width="1200" height="400" rx="16" fill="url(#tGrid)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="398.5" rx="15.25" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- ================= LEFT WINDOW: LIVE TERMINAL & QUALITY GATE LOGS ================= -->
  <rect x="24" y="22" width="580" height="356" rx="12" fill="#05070D" stroke="#334155" stroke-width="1.2"/>
  <rect x="24" y="22" width="580" height="34" rx="12" fill="#0F172A"/>
  <line x1="24" y1="56" x2="604" y2="56" stroke="#334155" stroke-width="1"/>
  
  <circle cx="44" cy="39" r="4.5" fill="#F43F5E"/>
  <circle cx="60" cy="39" r="4.5" fill="#F59E0B"/>
  <circle cx="76" cy="39" r="4.5" fill="#10B981"/>
  <text x="98" y="43" class="mono" font-size="11.5" font-weight="700" fill="#CBD5E1">bash — quality-gate-runner.sh (verified metrics)</text>
  <rect x="505" y="29" width="84" height="20" rx="4" fill="#064E3B" stroke="#10B981" stroke-width="0.8"/>
  <text x="547" y="43" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#34D399">STRICT SLA</text>

  <!-- Terminal Lines -->
  <g class="mono" font-size="11.5">
    <text x="42" y="84" fill="#38BDF8">$ cat /etc/data-engineer/profile.yaml</text>
    <text x="42" y="106" fill="#94A3B8">engineer:</text>
    <text x="115" y="106" fill="#F8FAFC" font-weight="700">Ahmed Sameh (@abosameh522)</text>
    <text x="42" y="125" fill="#94A3B8">base:</text>
    <text x="115" y="125" fill="#E2E8F0">El-Mahalla El-Kubra / Cairo, Egypt</text>
    <text x="42" y="144" fill="#94A3B8">degree:</text>
    <text x="115" y="144" fill="#E2E8F0">B.Sc. Computer Science &amp; AI, Mansoura Univ. (2027)</text>
    <text x="42" y="163" fill="#94A3B8">focus:</text>
    <text x="115" y="163" fill="#22D3EE" font-weight="700">[Batch ETL, Medallion Lakehouse, Dimensional Modeling]</text>
    <text x="42" y="182" fill="#94A3B8">target:</text>
    <text x="115" y="182" fill="#34D399" font-weight="700">Data Engineer &amp; Data Analyst Roles (Egypt / Remote)</text>

    <line x1="42" y1="198" x2="584" y2="198" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>

    <text x="42" y="220" fill="#38BDF8">$ pytest --strict-markers &amp;&amp; pandera validate --all-layers</text>
    
    <text x="42" y="244" fill="#34D399">[PASS]</text>
    <text x="92" y="244" fill="#E2E8F0">Bronze → Silver schema &amp; null-rate contract (84,235,008 rows)</text>

    <text x="42" y="265" fill="#34D399">[PASS]</text>
    <text x="92" y="265" fill="#E2E8F0">Olist Star Schema idempotent load (28 unit + 4 PG integration)</text>

    <text x="42" y="286" fill="#34D399">[PASS]</text>
    <text x="92" y="286" fill="#E2E8F0">Zero data leakage: temporal + spatial &amp; domain-grouped splits</text>

    <text x="42" y="307" fill="#F59E0B">[AUDIT]</text>
    <text x="96" y="307" fill="#FDE68A">Pre-registered bar miss reported honestly (-0.0008 PR-AUC S3)</text>

    <text x="42" y="328" fill="#F59E0B">[AUDIT]</text>
    <text x="96" y="328" fill="#FDE68A">Phishing holdout touched once (154,963 URLs) → gates logged</text>

    <rect x="42" y="342" width="544" height="24" rx="5" fill="#0F172A" stroke="#1E293B"/>
    <circle cx="56" cy="354" r="4" fill="#10B981" class="dot-live"/>
    <text x="68" y="358" font-size="11" font-weight="700" fill="#A7F3D0">PIPELINE VERDICT: OUTPUT CAN BE TRUSTED DOWNSTREAM</text>
  </g>

  <!-- ================= RIGHT PANEL: ENGINEERING PRINCIPLES & GUARANTEES ================= -->
  <text x="628" y="46" class="mono" font-size="11.5" font-weight="700" fill="#22D3EE" letter-spacing="1.2">ENGINEERING DOCTRINE // WHY OUTPUTS ARE TRUSTED</text>
  <text x="628" y="74" class="sans" font-size="22" font-weight="800" fill="#F8FAFC">Data Quality &amp; Honest Evaluation First</text>

  <!-- Principle Card 1 -->
  <rect x="628" y="92" width="548" height="86" rx="10" fill="#0D1322" stroke="#1E293B" stroke-width="1.2"/>
  <rect x="628" y="92" width="6" height="86" rx="3" fill="#22D3EE"/>
  <rect x="648" y="106" width="128" height="20" rx="4" fill="#083344" stroke="#0891B2" stroke-width="0.8"/>
  <text x="712" y="120" text-anchor="middle" class="mono" font-size="10" font-weight="800" fill="#22D3EE">01 · HARD GATES</text>
  <text x="788" y="120" class="sans" font-size="14" font-weight="700" fill="#F8FAFC">Stop the Run — Never Pass Bad Rows</text>
  <text x="648" y="144" class="sans" font-size="12.5" fill="#94A3B8">Every Medallion layer (Bronze → Silver → Gold) &amp; warehouse load is gated on</text>
  <text x="648" y="163" class="sans" font-size="12.5" fill="#94A3B8">Pandera schema contracts, aggregate invariants &amp; idempotent conflict checks.</text>

  <!-- Principle Card 2 -->
  <rect x="628" y="190" width="548" height="86" rx="10" fill="#0D1322" stroke="#1E293B" stroke-width="1.2"/>
  <rect x="628" y="190" width="6" height="86" rx="3" fill="#A855F7"/>
  <rect x="648" y="204" width="144" height="20" rx="4" fill="#2E1065" stroke="#7E22CE" stroke-width="0.8"/>
  <text x="720" y="218" text-anchor="middle" class="mono" font-size="10" font-weight="800" fill="#A855F7">02 · ZERO LEAKAGE</text>
  <text x="804" y="218" class="sans" font-size="14" font-weight="700" fill="#F8FAFC">Protocols Fixed Before Looking at Results</text>
  <text x="648" y="242" class="sans" font-size="12.5" fill="#94A3B8">Temporal split + spatially held-out region on Nile Delta crop stress; canonical</text>
  <text x="648" y="261" class="sans" font-size="12.5" fill="#94A3B8">domain-grouped splits on Phishing URLs; nested CV on South German Credit.</text>

  <!-- Principle Card 3 -->
  <rect x="628" y="288" width="548" height="90" rx="10" fill="#0D1322" stroke="#1E293B" stroke-width="1.2"/>
  <rect x="628" y="288" width="6" height="90" rx="3" fill="#F59E0B"/>
  <rect x="648" y="302" width="154" height="20" rx="4" fill="#451A03" stroke="#D97706" stroke-width="0.8"/>
  <text x="725" y="316" text-anchor="middle" class="mono" font-size="10" font-weight="800" fill="#F59E0B">03 · HONEST METRICS</text>
  <text x="814" y="316" class="sans" font-size="14" font-weight="700" fill="#F8FAFC">When a Model Misses, It Is Reported as a Miss</text>
  <text x="648" y="340" class="sans" font-size="12.5" fill="#94A3B8">No cherry-picked winners: Nile Delta full model misses its pre-registered PR-AUC</text>
  <text x="648" y="359" class="sans" font-size="12.5" fill="#94A3B8">bar by 0.0008 (NDVI-only beats weather), and Credit Risk reports a 6-model tie.</text>
</svg>