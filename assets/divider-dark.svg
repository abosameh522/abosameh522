<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="900" height="24" role="presentation">
  <defs>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0"/>
      <stop offset="25%" stop-color="#06B6D4" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.65"/>
      <stop offset="75%" stop-color="#06B6D4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <line x1="20" y1="12" x2="880" y2="12" stroke="url(#line)" stroke-width="1.5"/>
  <path id="track" d="M 40 12 L 860 12" fill="none"/>
  <circle r="3.5" fill="#22D3EE" filter="url(#glow)">
    <animateMotion dur="4.2s" repeatCount="indefinite"><mpath href="#track"/></animateMotion>
  </circle>
  <circle r="2.5" fill="#A78BFA" filter="url(#glow)">
    <animateMotion dur="4.2s" begin="2.1s" repeatCount="indefinite"><mpath href="#track"/></animateMotion>
  </circle>
</svg>
