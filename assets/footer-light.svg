<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 108" width="900" height="108" role="img" aria-label="Open to Junior Data Engineer Roles and Internships - Cairo, Egypt or Remote">
  <defs>
    <linearGradient id="fbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#0891B2" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.14"/>
    </linearGradient>
    <clipPath id="fc">
      <rect width="900" height="108" rx="14"/>
    </clipPath>
  </defs>
  <style>
    .ftitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
    .fsub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; fill: #475569; }
    .w1 { animation: drift1 9s ease-in-out infinite alternate; }
    .w2 { animation: drift2 11s ease-in-out infinite alternate; }
    @keyframes drift1 { from { transform: translateX(0px); } to { transform: translateX(-60px); } }
    @keyframes drift2 { from { transform: translateX(-50px); } to { transform: translateX(10px); } }
  </style>
  <g clip-path="url(#fc)">
    <rect width="900" height="108" fill="url(#fbg)"/>
    <path class="w1" d="M 0 74 Q 150 48, 300 74 T 600 74 T 900 74 T 1200 74 L 1200 108 L 0 108 Z" fill="url(#wave1)"/>
    <path class="w2" d="M 0 82 Q 180 62, 360 82 T 720 82 T 1080 82 L 1080 108 L 0 108 Z" fill="url(#wave2)"/>
    <text x="450" y="38" class="ftitle" text-anchor="middle">Let's turn raw, messy data into reliable data systems.</text>
    <text x="450" y="61" class="fsub" text-anchor="middle">Open to Junior Data Engineer Roles &amp; Internships  ·  Cairo, Egypt &amp; Remote</text>
  </g>
  <rect x="0.75" y="0.75" width="898.5" height="106.5" rx="13.5" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
</svg>
