<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="Production Data Engineering and Applied ML Systems">
  <defs>
    <pattern id="pGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#CBD5E1" stroke-width="0.6" stroke-opacity="0.55"/>
    </pattern>
    <linearGradient id="featBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      @keyframes streamDash {
        to { stroke-dashoffset: -36; }
      }
      .pipe-anim {
        stroke-dasharray: 6 6;
        animation: streamDash 1.8s linear infinite;
      }
    </style>
  </defs>

  <rect width="1200" height="540" rx="16" fill="#F8FAFC"/>
  <rect width="1200" height="540" rx="16" fill="url(#pGrid)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="538.5" rx="15.25" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Section Header -->
  <text x="28" y="38" class="mono" font-size="11.5" font-weight="700" fill="#0891B2" letter-spacing="1.2">DEPLOYED PIPELINES &amp; BENCHMARKS // VERIFIED REPOSITORIES</text>
  <text x="28" y="66" class="sans" font-size="24" font-weight="800" fill="#0F172A">Flagship Lakehouse &amp; Production Case Studies</text>

  <!-- ================= FLAGSHIP CARD: NILE DELTA CROP MONITORING ================= -->
  <rect x="28" y="84" width="1144" height="196" rx="14" fill="#FFFFFF" stroke="url(#featBorder)" stroke-width="1.8"/>
  
  <!-- Top Tag Row -->
  <rect x="48" y="102" width="196" height="22" rx="5" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1"/>
  <text x="146" y="117" text-anchor="middle" class="mono" font-size="10.5" font-weight="800" fill="#0891B2">★ FLAGSHIP LAKEHOUSE</text>

  <rect x="256" y="102" width="175" height="22" rx="5" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
  <text x="343" y="117" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#059669">231 PASSED · 2.6MB DEMO</text>

  <text x="48" y="152" class="sans" font-size="22" font-weight="800" fill="#0F172A">Nile Delta Crop Monitoring System (2019–2024)</text>
  <text x="48" y="175" class="sans" font-size="13" fill="#475569">Satellite pipeline over a 50×50 km central Nile Delta AOI (6 seasons): Sentinel-2 L2A &amp; Open-Meteo</text>
  <text x="48" y="195" class="sans" font-size="13" fill="#475569">into a Bronze → Silver → Gold Parquet lake with Pandera gates, spatiotemporal XGBoost &amp; Streamlit.</text>

  <!-- Tech Stack Pills on Flagship -->
  <g transform="translate(48, 212)">
    <rect x="0" y="0" width="58" height="22" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/><text x="29" y="15" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#0891B2">Python</text>
    <rect x="64" y="0" width="62" height="22" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/><text x="95" y="15" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#0891B2">Prefect</text>
    <rect x="132" y="0" width="60" height="22" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/><text x="162" y="15" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#D97706">DuckDB</text>
    <rect x="198" y="0" width="64" height="22" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/><text x="230" y="15" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#D97706">Parquet</text>
    <rect x="268" y="0" width="64" height="22" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/><text x="300" y="15" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#7C3AED">Pandera</text>
    <rect x="338" y="0" width="64" height="22" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/><text x="370" y="15" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#059669">XGBoost</text>
    <rect x="408" y="0" width="72" height="22" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/><text x="444" y="15" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#E11D48">Streamlit</text>
    <rect x="486" y="0" width="144" height="22" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/><text x="558" y="15" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#475569">Docker · Plotly · uv</text>
  </g>

  <!-- Scientific Finding Strip -->
  <rect x="48" y="244" width="684" height="24" rx="5" fill="#FFFBEB" stroke="#F59E0B" stroke-width="0.9"/>
  <text x="58" y="260" class="mono" font-size="10" font-weight="700" fill="#D97706">AUDIT: Full model misses PR-AUC bar by 0.0008 (S3); NDVI-only variant beats weather across all campaigns.</text>

  <!-- Flagship Right Telemetry Gauges -->
  <rect x="748" y="100" width="404" height="166" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="768" y="122" class="mono" font-size="10.5" font-weight="700" fill="#64748B">LAKEHOUSE SCALE &amp; VERIFICATION TELEMETRY</text>
  
  <!-- 3 Metric Boxes inside Flagship Right -->
  <rect x="766" y="134" width="114" height="64" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="823" y="154" text-anchor="middle" class="mono" font-size="9.5" fill="#64748B">100M GRID CELLS</text>
  <text x="823" y="182" text-anchor="middle" class="mono" font-size="18" font-weight="800" fill="#0891B2">239,304</text>

  <rect x="893" y="134" width="114" height="64" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="950" y="154" text-anchor="middle" class="mono" font-size="9.5" fill="#64748B">SILVER ROWS</text>
  <text x="950" y="182" text-anchor="middle" class="mono" font-size="18" font-weight="800" fill="#7C3AED">84.23M</text>

  <rect x="1020" y="134" width="114" height="64" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="1077" y="154" text-anchor="middle" class="mono" font-size="9.5" fill="#64748B">BRONZE REBUILT</text>
  <text x="1077" y="182" text-anchor="middle" class="mono" font-size="18" font-weight="800" fill="#D97706">30.7 GB</text>

  <!-- Mini animated pipeline bar inside Flagship Right -->
  <line x1="774" y1="224" x2="1126" y2="224" stroke="#CBD5E1" stroke-width="2"/>
  <line x1="774" y1="224" x2="1126" y2="224" stroke="#0891B2" stroke-width="2" class="pipe-anim"/>
  <text x="768" y="248" class="mono" font-size="10" font-weight="600" fill="#059669">✓ P@R.5 &amp; Brier Score Pass Throughout · 6 Seasons (2019–2024)</text>

  <!-- ================= 2x2 GRID OF OTHER 4 PROJECTS ================= -->
  <!-- Card 1: E-commerce Data Pipeline -->
  <g transform="translate(28, 296)">
    <rect width="562" height="106" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <rect width="6" height="106" rx="3" fill="#0891B2"/>
    <text x="22" y="26" class="sans" font-size="16.5" font-weight="800" fill="#0F172A">E-commerce Data Pipeline (Olist Star Schema)</text>
    <rect x="404" y="10" width="142" height="20" rx="4" fill="#ECFEFF" stroke="#06B6D4" stroke-width="0.8"/>
    <text x="475" y="24" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#0891B2">32 TESTS · IDEMPOTENT</text>
    <text x="22" y="49" class="sans" font-size="12.5" fill="#475569">Batch ETL from 6 Olist CSVs into a PostgreSQL star schema with a quality-checks</text>
    <text x="22" y="67" class="sans" font-size="12.5" fill="#475569">table, 3 analytical views &amp; 15 SQL queries (`INSERT ... ON CONFLICT DO NOTHING`).</text>
    <text x="22" y="91" class="mono" font-size="10.5" font-weight="600" fill="#0891B2">Python · SQL · PostgreSQL · pandas · Docker Compose · pytest · Ruff</text>
  </g>

  <!-- Card 2: Phishing URL Detection -->
  <g transform="translate(610, 296)">
    <rect width="562" height="106" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <rect width="6" height="106" rx="3" fill="#7C3AED"/>
    <text x="22" y="26" class="sans" font-size="16.5" font-weight="800" fill="#0F172A">Phishing URL Detection Service</text>
    <rect x="382" y="10" width="164" height="20" rx="4" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="0.8"/>
    <text x="464" y="24" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#7C3AED">154.9K HOLDOUT · 0.945 AUC</text>
    <text x="22" y="49" class="sans" font-size="12.5" fill="#475569">Canonicalised URL detector with domain-grouped splits behind FastAPI &amp; Streamlit.</text>
    <text x="22" y="67" class="sans" font-size="12.5" fill="#475569">Touched-once holdout: ROC-AUC 0.945, AP 0.944, recall@1%FPR 0.569 (gates logged).</text>
    <text x="22" y="91" class="mono" font-size="10.5" font-weight="600" fill="#7C3AED">Python · LightGBM · scikit-learn · FastAPI · Streamlit · pandas · uv</text>
  </g>

  <!-- Card 3: Customer Churn Prediction -->
  <g transform="translate(28, 414)">
    <rect width="562" height="106" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <rect width="6" height="106" rx="3" fill="#059669"/>
    <text x="22" y="26" class="sans" font-size="16.5" font-weight="800" fill="#0F172A">Customer Churn Retention Economics</text>
    <rect x="386" y="10" width="160" height="20" rx="4" fill="#ECFDF5" stroke="#10B981" stroke-width="0.8"/>
    <text x="466" y="24" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#059669">-71.9% SIMULATED COST</text>
    <text x="22" y="49" class="sans" font-size="12.5" fill="#475569">Threshold optimization trading a 20-unit retention offer vs 12 months revenue at risk.</text>
    <text x="22" y="67" class="sans" font-size="12.5" fill="#475569">Cuts expected cost from 89,367 → 25,102; untouched test split: 0.839 AUC, 0.987 recall.</text>
    <text x="22" y="91" class="mono" font-size="10.5" font-weight="600" fill="#059669">Python · scikit-learn · pandas · matplotlib · pytest · Ruff</text>
  </g>

  <!-- Card 4: Credit Risk Analysis -->
  <g transform="translate(610, 414)">
    <rect width="562" height="106" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <rect width="6" height="106" rx="3" fill="#D97706"/>
    <text x="22" y="26" class="sans" font-size="16.5" font-weight="800" fill="#0F172A">Credit Risk Cost-Matrix Screening</text>
    <rect x="386" y="10" width="160" height="20" rx="4" fill="#FFFBEB" stroke="#F59E0B" stroke-width="0.8"/>
    <text x="466" y="24" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#D97706">NESTED CV · 5:1 MATRIX</text>
    <text x="22" y="49" class="sans" font-size="12.5" fill="#475569">Nested cross-validation on 1,000 South German Credit loans against a 5:1 cost matrix.</text>
    <text x="22" y="67" class="sans" font-size="12.5" fill="#475569">6 top models sit within 1 SD (111–113 cost); tuned threshold cuts test cost 187 → 132.</text>
    <text x="22" y="91" class="mono" font-size="10.5" font-weight="600" fill="#D97706">Python · scikit-learn · pandas · matplotlib · pytest · Ruff</text>
  </g>
</svg>