    <text x="1149" y="239" text-anchor="middle" class="mono" font-size="9.5" font-weight="800" fill="#CA8A04">BI/ML</text>
  </g>

  <!-- Bottom Live Command Stream Bar -->
  <rect x="36" y="330" width="1148" height="42" rx="9" fill="#0F172A" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="54" y="355" class="mono" font-size="12" font-weight="700" fill="#059669">ahmed@lakehouse:~$</text>
  <text x="196" y="355" class="mono" font-size="12" fill="#E2E8F0">prefect deployment run nile-delta-pipeline/prod --param gate_policy=strict_halt</text>
  <rect x="772" y="343" width="7" height="15" fill="#0891B2" class="cursor"/>
  <text x="805" y="355" class="mono" font-size="11.5" font-weight="700" fill="#0891B2">[✓ 231/231 TESTS PASS]</text>
