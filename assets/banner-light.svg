  </circle>
  <circle r="4" fill="#0284C7" filter="url(#softGlow)">
    <animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#dagGate1ToSilver"/></animateMotion>
  </circle>
  <circle r="3.5" fill="#CA8A04" filter="url(#softGlow)">
    <animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#dagGate2ToGold1"/></animateMotion>
  </circle>
  <circle r="3.5" fill="#CA8A04" filter="url(#softGlow)">
    <animateMotion dur="2.2s" begin="-0.7s" repeatCount="indefinite"><mpath href="#dagGate2ToGold2"/></animateMotion>
  </circle>
  <circle r="3.5" fill="#CA8A04" filter="url(#softGlow)">
    <animateMotion dur="2.2s" begin="-1.4s" repeatCount="indefinite"><mpath href="#dagGate2ToGold3"/></animateMotion>
  </circle>

  <!-- Source Nodes (Column 1: x=556..608) -->
  <g>
    <rect x="556" y="96" width="52" height="28" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="582" y="114" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#0F172A">S2-L2A</text>
    
    <rect x="556" y="176" width="52" height="28" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
