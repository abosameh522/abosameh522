<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Ahmed Sameh - Junior Data Engineer animated data pipeline banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="55%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#CBD5E1" stroke-width="0.6" opacity="0.55"/>
    </pattern>
    <clipPath id="cardClip">
      <rect width="900" height="260" rx="16"/>
    </clipPath>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #0F172A; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; fill: #334155; }
    .muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; fill: #64748B; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .pipe { fill: none; stroke: #94A3B8; stroke-width: 2; stroke-dasharray: 5 5; animation: flow 1.8s linear infinite; }
    .pipe-out { fill: none; stroke: #0284C7; stroke-width: 2; stroke-opacity: 0.55; stroke-dasharray: 6 5; animation: flow 1.5s linear infinite; }
    .pulse-dot { animation: pulse 2s ease-in-out infinite; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .bar1 { animation: eq 1.4s ease-in-out infinite; transform-origin: center bottom; }
    .bar2 { animation: eq 1.4s ease-in-out 0.25s infinite; transform-origin: center bottom; }
    .bar3 { animation: eq 1.4s ease-in-out 0.5s infinite; transform-origin: center bottom; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes eq { 0%, 100% { transform: scaleY(0.45); } 50% { transform: scaleY(1); } }
  </style>

  <g clip-path="url(#cardClip)">
    <rect width="900" height="260" fill="url(#bg)"/>
    <rect width="900" height="260" fill="url(#grid)"/>
    <rect x="0" y="0" width="900" height="3.5" fill="url(#accent)"/>

    <!-- Status Badge -->
    <rect x="38" y="30" width="308" height="26" rx="13" fill="#ECFDF5" stroke="#10B981" stroke-opacity="0.55" stroke-width="1"/>
    <circle cx="54" cy="43" r="4.5" fill="#059669" class="pulse-dot"/>
    <text x="67" y="47" class="mono" font-size="10.5" font-weight="700" fill="#047857" letter-spacing="0.7">JUNIOR DATA ENGINEER · OPEN TO WORK</text>

    <!-- Main Name -->
    <text x="38" y="106" class="title" font-size="40" letter-spacing="-0.6">Ahmed Sameh</text>
    <rect x="38" y="118" width="96" height="4" rx="2" fill="url(#accent)"/>

    <!-- Tagline -->
    <text x="38" y="148" class="sub" font-size="15">Building reliable ETL pipelines, clean data models</text>
    <text x="38" y="170" class="sub" font-size="15">&amp; quality-gated lakehouses from raw data to insight.</text>

    <!-- Meta Row -->
    <text x="38" y="198" class="muted" font-size="12.5">Cairo, Egypt  ·  @abosameh522  ·  SQL · Python · ETL/ELT · Cloud</text>

    <!-- RIGHT SECTION: Animated Data Pipeline Visualization -->
    <rect x="478" y="24" width="388" height="184" rx="14" fill="#FFFFFF" fill-opacity="0.92" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="496" y="45" class="mono" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1.1">LIVE PIPELINE TOPOLOGY</text>
    <circle cx="848" cy="41" r="3.5" fill="#0284C7" class="pulse-dot"/>
    <text x="838" y="45" class="mono" font-size="9.5" fill="#0284C7" text-anchor="end">STREAMING</text>

    <!-- Pipe Paths -->
    <path id="p1" d="M 556 80 C 590 80, 595 116, 632 116" class="pipe"/>
    <path id="p2" d="M 556 122 L 632 122" class="pipe"/>
    <path id="p3" d="M 556 164 C 590 164, 595 128, 632 128" class="pipe"/>
    <path id="p4" d="M 730 112 C 756 112, 756 92, 778 92" class="pipe-out"/>
    <path id="p5" d="M 730 132 C 756 132, 756 152, 778 152" class="pipe-out"/>

    <!-- Animated Data Packets -->
    <circle r="3.8" fill="#D97706">
      <animateMotion dur="2.6s" repeatCount="indefinite" begin="0s"><mpath href="#p1"/></animateMotion>
    </circle>
    <circle r="3.8" fill="#0284C7">
      <animateMotion dur="2.1s" repeatCount="indefinite" begin="0.4s"><mpath href="#p2"/></animateMotion>
    </circle>
    <circle r="3.8" fill="#059669">
      <animateMotion dur="2.8s" repeatCount="indefinite" begin="0.9s"><mpath href="#p3"/></animateMotion>
    </circle>
    <circle r="4" fill="#7C3AED">
      <animateMotion dur="2.2s" repeatCount="indefinite" begin="0.3s"><mpath href="#p4"/></animateMotion>
    </circle>
    <circle r="4" fill="#0891B2">
      <animateMotion dur="2.4s" repeatCount="indefinite" begin="1.1s"><mpath href="#p5"/></animateMotion>
    </circle>

    <!-- Source Nodes -->
    <g transform="translate(494, 64)">
      <rect width="62" height="32" rx="7" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
      <text x="31" y="20" class="mono" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">APIs</text>
    </g>
    <g transform="translate(494, 106)">
      <rect width="62" height="32" rx="7" fill="#F0F9FF" stroke="#0284C7" stroke-width="1"/>
      <text x="31" y="20" class="mono" font-size="11" font-weight="700" fill="#0369A1" text-anchor="middle">CSVs</text>
    </g>
    <g transform="translate(494, 148)">
      <rect width="62" height="32" rx="7" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
      <text x="31" y="20" class="mono" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">SQL DB</text>
    </g>

    <!-- Center ETL / Quality Node -->
    <g transform="translate(632, 82)">
      <rect width="98" height="80" rx="11" fill="#F8FAFC" stroke="#0284C7" stroke-width="1.5"/>
      <text x="49" y="24" class="mono" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="middle">ETL / ELT</text>
      <text x="49" y="40" class="mono" font-size="9" fill="#0284C7" text-anchor="middle">Quality Gates</text>
      <rect x="33" y="50" width="6" height="18" rx="2" fill="#0284C7" class="bar1"/>
      <rect x="46" y="46" width="6" height="22" rx="2" fill="#2563EB" class="bar2"/>
      <rect x="59" y="52" width="6" height="16" rx="2" fill="#7C3AED" class="bar3"/>
    </g>

    <!-- Destination Nodes -->
    <g transform="translate(778, 68)">
      <rect width="74" height="46" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.2"/>
      <text x="37" y="21" class="mono" font-size="10.5" font-weight="700" fill="#5B21B6" text-anchor="middle">WAREHOUSE</text>
      <text x="37" y="36" class="mono" font-size="8.5" fill="#7C3AED" text-anchor="middle">Star Schema</text>
    </g>
    <g transform="translate(778, 128)">
      <rect width="74" height="46" rx="8" fill="#ECFEFF" stroke="#0891B2" stroke-width="1.2"/>
      <text x="37" y="21" class="mono" font-size="10.5" font-weight="700" fill="#155E75" text-anchor="middle">LAKEHOUSE</text>
      <text x="37" y="36" class="mono" font-size="8.5" fill="#0891B2" text-anchor="middle">Parquet</text>
    </g>

    <!-- Bottom Terminal Bar -->
    <rect x="38" y="218" width="828" height="28" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="52" y="236" class="mono" font-size="11" fill="#0284C7">$</text>
    <text x="66" y="236" class="mono" font-size="11" fill="#334155">python -m pipeline.run --layer=bronze,silver,gold --validate=pandera</text>
    <rect x="522" y="226" width="7" height="12" fill="#0284C7" class="cursor"/>
    <text x="852" y="236" class="mono" font-size="10.5" font-weight="700" fill="#059669" text-anchor="end">[ ✓ ALL CHECKS PASS ]</text>
  </g>
  <rect x="0.75" y="0.75" width="898.5" height="258.5" rx="15.5" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
</svg>
