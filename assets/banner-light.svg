    <text x="860" y="179" text-anchor="middle" class="mono" font-size="9.5" font-weight="800" fill="#7C3AED">QG</text>
    <text x="860" y="270" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#7C3AED">PANDERA</text>
  </g>

  <!-- SILVER NODE (x=920..1020, y=128..222) -->
  <g>
    <rect x="920" y="128" width="100" height="94" rx="10" fill="#ECFEFF" stroke="#0284C7" stroke-width="1.6"/>
    <rect x="930" y="138" width="80" height="18" rx="4" fill="#0284C7" fill-opacity="0.22"/>
    <text x="970" y="151" text-anchor="middle" class="mono" font-size="10.5" font-weight="800" fill="#0284C7">02 · SILVER</text>
    <text x="970" y="175" text-anchor="middle" class="sans" font-size="11.5" font-weight="700" fill="#0F172A">Validated</text>
