    <text x="582" y="274" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#0F172A">URL/LOG</text>
  </g>

  <!-- BRONZE NODE (x=695..795, y=130..220) -->
  <g>
    <rect x="695" y="128" width="100" height="94" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.6"/>
    <rect x="705" y="138" width="80" height="18" rx="4" fill="#B45309" fill-opacity="0.22"/>
    <text x="745" y="151" text-anchor="middle" class="mono" font-size="10.5" font-weight="800" fill="#B45309">01 · BRONZE</text>
    <text x="745" y="175" text-anchor="middle" class="sans" font-size="11.5" font-weight="700" fill="#0F172A">Raw Parquet</text>
