  <use href="#dagSrc2" fill="none" stroke="#B45309" stroke-width="1.8" class="flow-edge"/>
  <use href="#dagSrc3" fill="none" stroke="#B45309" stroke-width="1.8" class="flow-edge"/>

  <use href="#dagBronzeToGate1" fill="none" stroke="#B45309" stroke-width="2.2" class="flow-edge"/>
  <use href="#dagGate1ToSilver" fill="none" stroke="#0284C7" stroke-width="2.2" class="flow-edge"/>
  <use href="#dagSilverToGate2" fill="none" stroke="#0284C7" stroke-width="2.2" class="flow-edge"/>
  <use href="#dagGate2ToGold1" fill="none" stroke="#CA8A04" stroke-width="1.8" class="flow-edge"/>
