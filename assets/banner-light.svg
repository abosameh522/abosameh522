  </circle>
  <text x="804" y="34" class="mono" font-size="10.5" font-weight="700" fill="#059669">DAG: HEALTHY · 0 DROP</text>

  <rect x="955" y="20" width="218" height="20" rx="10" fill="#ECFEFF" stroke="#06B6D4" stroke-width="0.9"/>
  <text x="967" y="34" class="mono" font-size="10.5" font-weight="600" fill="#0891B2">REGION: CAIRO, EG (UTC+2)</text>

  <!-- ================= LEFT PANEL: IDENTITY & MISSION ================= -->
  <!-- Role Tag -->
  <rect x="36" y="66" width="322" height="26" rx="6" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1"/>
  <circle cx="50" cy="79" r="4" fill="#0891B2" class="pulse"/>
  <text x="62" y="83" class="mono" font-size="11.5" font-weight="700" fill="#0891B2" letter-spacing="1.2">DATA ENGINEER · LAKEHOUSE ARCHITECT</text>

  <!-- Main Name -->
  <text x="36" y="148" class="sans" font-size="54" font-weight="800" fill="#0F172A" letter-spacing="-1.2">Ahmed Sameh</text>
  
  <!-- Handle & University Badge -->
  <text x="38" y="176" class="mono" font-size="13.5" font-weight="600" fill="#7C3AED">@abosameh522</text>
  <text x="144" y="176" class="mono" font-size="12.5" fill="#64748B">//</text>
  <text x="164" y="176" class="sans" font-size="13" font-weight="600" fill="#475569">CS &amp; AI '27 · Mansoura Univ. · Egypt &amp; Remote</text>

  <!-- Core Engineering Pitch -->
  <text x="38" y="206" class="sans" font-size="13.5" fill="#475569">Building end-to-end batch pipelines, Medallion Parquet lakes &amp; star schemas</text>
  <text x="38" y="227" class="sans" font-size="13.5" fill="#475569">where <tspan font-weight="700" fill="#0891B2">strict quality gates</tspan> halt bad rows before downstream models.</text>

  <!-- Key Telemetry Mini-Counters (Left Bottom) -->
  <!-- Card 1 -->
  <rect x="36" y="250" width="155" height="62" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
  <path d="M 36 260 A 10 10 0 0 1 46 250 L 181 250 A 10 10 0 0 1 191 260" fill="none" stroke="#0891B2" stroke-width="2"/>
  <text x="48" y="271" class="mono" font-size="10" font-weight="700" fill="#64748B">SILVER LAKE ROWS</text>
  <text x="48" y="298" class="mono" font-size="22" font-weight="800" fill="#0F172A">84.2M</text>
  <text x="125" y="297" class="mono" font-size="10" font-weight="700" fill="#0891B2">GATED</text>

  <!-- Card 2 -->
  <rect x="203" y="250" width="155" height="62" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
  <path d="M 203 260 A 10 10 0 0 1 213 250 L 348 250 A 10 10 0 0 1 358 260" fill="none" stroke="#7C3AED" stroke-width="2"/>
  <text x="215" y="271" class="mono" font-size="10" font-weight="700" fill="#64748B">BRONZE INGESTED</text>
  <text x="215" y="298" class="mono" font-size="22" font-weight="800" fill="#0F172A">30.7 GB</text>
  <text x="313" y="297" class="mono" font-size="10" font-weight="700" fill="#7C3AED">RAW</text>

  <!-- Card 3 -->
  <rect x="370" y="250" width="155" height="62" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
  <path d="M 370 260 A 10 10 0 0 1 380 250 L 515 250 A 10 10 0 0 1 525 260" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="382" y="271" class="mono" font-size="10" font-weight="700" fill="#64748B">AUTOMATED TESTS</text>
  <text x="382" y="298" class="mono" font-size="22" font-weight="800" fill="#0F172A">263</text>
  <text x="432" y="297" class="mono" font-size="10" font-weight="700" fill="#059669">PASSING</text>

  <!-- ================= RIGHT PANEL: LIVE MEDALLION DAG SCHEMATIC ================= -->
  <rect x="545" y="62" width="639" height="250" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
  
  <!-- DAG Panel Header -->
  <rect x="545" y="62" width="639" height="28" rx="12" fill="#F8FAFC"/>
  <line x1="545" y1="90" x2="1184" y2="90" stroke="#E2E8F0" stroke-width="1"/>
