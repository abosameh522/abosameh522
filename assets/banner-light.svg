<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-label="Ahmed Sameh — Data Engineer Control Plane">
  <defs>
    <pattern id="bgGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#CBD5E1" stroke-width="0.75" stroke-opacity="0.55"/>
      <circle cx="32" cy="32" r="1" fill="#0891B2" fill-opacity="0.22"/>
    </pattern>
    <radialGradient id="orbCyan" cx="20%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbViolet" cx="82%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- DAG Motion Paths -->
    <path id="dagSrc1" d="M 605 110 C 645 110, 650 165, 695 165"/>
    <path id="dagSrc2" d="M 605 190 C 645 190, 650 175, 695 175"/>
    <path id="dagSrc3" d="M 605 270 C 645 270, 650 185, 695 185"/>
    <path id="dagBronzeToGate1" d="M 795 175 L 845 175"/>
    <path id="dagGate1ToSilver" d="M 875 175 L 920 175"/>
    <path id="dagSilverToGate2" d="M 1020 175 L 1060 175"/>
    <path id="dagGate2ToGold1" d="M 1085 175 C 1105 175, 1105 115, 1130 115"/>
    <path id="dagGate2ToGold2" d="M 1085 175 L 1130 175"/>
    <path id="dagGate2ToGold3" d="M 1085 175 C 1105 175, 1105 235, 1130 235"/>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -48; }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .flow-edge {
        stroke-dasharray: 5 7;
        animation: dashFlow 2.2s linear infinite;
      }
      .cursor {
        animation: blinkCursor 1.1s infinite;
      }
      .pulse {
        animation: pulseGlow 2.8s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .flow-edge, .cursor, .pulse { animation: none; }
      }
    </style>
  </defs>

  <!-- Main Canvas Background -->
  <rect width="1200" height="390" rx="16" fill="#F8FAFC"/>
  <rect width="1200" height="390" rx="16" fill="url(#bgGrid)"/>
  <rect width="1200" height="390" rx="16" fill="url(#orbCyan)"/>
  <rect width="1200" height="390" rx="16" fill="url(#orbViolet)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="388.5" rx="15.25" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Top Telemetry Header Strip -->
  <path d="M 16 1.5 L 1184 1.5" stroke="url(#topBarGrad)" stroke-width="3" stroke-linecap="round"/>
  <rect x="16" y="14" width="1168" height="32" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  
  <!-- Window Dots -->
  <circle cx="34" cy="30" r="4.5" fill="#E11D48"/>
  <circle cx="50" cy="30" r="4.5" fill="#D97706"/>
  <circle cx="66" cy="30" r="4.5" fill="#059669"/>
  
  <text x="86" y="34" class="mono" font-size="11.5" font-weight="600" fill="#475569">orchestrator://abosameh522/lakehouse-control-plane</text>
  
  <!-- Live Status Pill in Top Bar -->
  <rect x="780" y="20" width="165" height="20" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="0.9"/>
  <circle cx="793" cy="30" r="3.5" fill="#059669">
    <animate attributeName="r" values="3;4.5;3" dur="1.8s" repeatCount="indefinite"/>
