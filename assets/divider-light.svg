<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28" role="presentation">
  <defs>
    <linearGradient id="divLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0"/>
      <stop offset="20%" stop-color="#0891B2" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#D97706" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="packetBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0"/>
      <stop offset="70%" stop-color="#0891B2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <line x1="20" y1="14" x2="1180" y2="14" stroke="url(#divLine)" stroke-width="1.5"/>
  <!-- Checkpoints -->
  <circle cx="300" cy="14" r="3" fill="#F8FAFC" stroke="#0891B2" stroke-width="1.5"/>
  <polygon points="600,8 606,14 600,20 594,14" fill="#F8FAFC" stroke="#7C3AED" stroke-width="1.5"/>
  <circle cx="900" cy="14" r="3" fill="#F8FAFC" stroke="#D97706" stroke-width="1.5"/>
  <!-- Animated Stream Pulses -->
  <rect x="-120" y="12.5" width="95" height="3" rx="1.5" fill="url(#packetBeam)">
    <animate attributeName="x" values="-120;1220" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="-120" y="12.5" width="75" height="3" rx="1.5" fill="url(#packetBeam)" opacity="0.7">
    <animate attributeName="x" values="-120;1220" dur="4.5s" begin="-2.25s" repeatCount="indefinite"/>
  </rect>
</svg>