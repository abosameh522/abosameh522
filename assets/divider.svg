<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="presentation">
  <defs>
    <linearGradient id="sig" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="20%" stop-color="#22D3EE" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#F59E0B" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <style>
      svg{--cyan:#007F92;--violet:#6941B6;--gold:#946500}
      @media (prefers-color-scheme:dark){svg{--cyan:#36C5D8;--violet:#A78BFA;--gold:#F2C14E}}
      .s-cyan{stroke:var(--cyan)}.s-violet{stroke:var(--violet)}.s-gold{stroke:var(--gold)}
      @keyframes sweep{0%{transform:translateX(-120px);opacity:0}8%{opacity:0.85}92%{opacity:0.85}100%{transform:translateX(1220px);opacity:0}}
      .beam{opacity:0;animation:sweep 4.5s linear infinite}
      .b2{animation-delay:-2.25s}
      @media (prefers-reduced-motion:reduce){.beam{animation:none}}
    </style>
  </defs>
  <line x1="20" y1="12" x2="1180" y2="12" stroke="url(#sig)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="300" cy="12" r="4" fill="none" class="s-cyan" stroke-width="1.6"/>
  <polygon points="600,6 606,12 600,18 594,12" fill="none" class="s-violet" stroke-width="1.6"/>
  <circle cx="900" cy="12" r="4" fill="none" class="s-gold" stroke-width="1.6"/>
  <rect x="0" y="10.5" width="90" height="3" rx="1.5" fill="url(#beam)" class="beam"/>
  <rect x="0" y="10.5" width="70" height="3" rx="1.5" fill="url(#beam)" class="beam b2"/>
</svg>
