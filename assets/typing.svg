<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" role="img" aria-label="Typewriter taglines: raw data to checked tables to useful decisions; bronze, silver, gold with quality gates; idempotent loads and schemas that fail loudly; honest metrics and documented limitations; batch pipelines minus the buzzwords.">
  <defs>
    <linearGradient id="sig" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      @keyframes blink{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
      @keyframes pulse{0%,100%{opacity:0.9}50%{opacity:0.35}}
      .pulse{animation:pulse 3.2s ease-in-out infinite}
      .d1{animation-delay:-1.1s}.d2{animation-delay:-2.2s}

      /* Line 0 opens fully typed so the first paint and the
         prefers-reduced-motion frame are complete sentences. */
      @keyframes op0{0%,17.9%{opacity:1}18.1%,99%{opacity:0}100%{opacity:1}}
      @keyframes op1{0%,20%{opacity:0}20.1%,37.9%{opacity:1}38.1%,100%{opacity:0}}
      @keyframes op2{0%,40%{opacity:0}40.1%,57.9%{opacity:1}58.1%,100%{opacity:0}}
      @keyframes op3{0%,60%{opacity:0}60.1%,77.9%{opacity:1}78.1%,100%{opacity:0}}
      @keyframes op4{0%,80%{opacity:0}80.1%,97.9%{opacity:1}98.1%,100%{opacity:0}}

      @keyframes cov0{0%,17.9%{transform:translateX(396px)}18.1%,98.9%{transform:translateX(0)}100%{transform:translateX(396px)}}
      @keyframes cov1{0%,20%{transform:translateX(0)}20.1%{transform:translateX(0);animation-timing-function:steps(42,end)}27.2%,100%{transform:translateX(378px)}}
      @keyframes cov2{0%,40%{transform:translateX(0)}40.1%{transform:translateX(0);animation-timing-function:steps(43,end)}47.2%,100%{transform:translateX(387px)}}
      @keyframes cov3{0%,60%{transform:translateX(0)}60.1%{transform:translateX(0);animation-timing-function:steps(39,end)}67.2%,100%{transform:translateX(351px)}}
      @keyframes cov4{0%,80%{transform:translateX(0)}80.1%{transform:translateX(0);animation-timing-function:steps(36,end)}87.2%,100%{transform:translateX(324px)}}

      .tl0{animation:op0 25s linear infinite}
      .tl1{animation:op1 25s linear infinite}
      .tl2{animation:op2 25s linear infinite}
      .tl3{animation:op3 25s linear infinite}
      .tl4{animation:op4 25s linear infinite}
      .cov0{animation:cov0 25s linear infinite}
      .cov1{animation:cov1 25s linear infinite}
      .cov2{animation:cov2 25s linear infinite}
      .cov3{animation:cov3 25s linear infinite}
      .cov4{animation:cov4 25s linear infinite}
      .cur0{animation:cov0 25s linear infinite,blink 1.1s linear infinite}
      .cur1{animation:cov1 25s linear infinite,blink 1.1s linear infinite}
      .cur2{animation:cov2 25s linear infinite,blink 1.1s linear infinite}
      .cur3{animation:cov3 25s linear infinite,blink 1.1s linear infinite}
      .cur4{animation:cov4 25s linear infinite,blink 1.1s linear infinite}
      @media (prefers-reduced-motion:reduce){
        .tl0,.tl1,.tl2,.tl3,.tl4,.cov0,.cov1,.cov2,.cov3,.cov4,.cur0,.cur1,.cur2,.cur3,.cur4,.pulse{animation:none}
      }
    </style>
  </defs>

  <rect width="1200" height="64" rx="12" fill="#0B1020"/>
  <rect x="0.75" y="0.75" width="1198.5" height="62.5" rx="11.25" fill="none" stroke="#2B3A4F" stroke-width="1.5"/>
  <path d="M16 62.5H1184" stroke="url(#sig)" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/>

  <text x="28" y="38" class="mono" font-size="15" fill="#36C5D8">ahmed@data:~$</text>

  <g class="tl0" style="opacity:1">
    <text x="164" y="38" class="mono" font-size="15" fill="#E6EDF5" textLength="396" lengthAdjust="spacing">raw data → checked tables → useful decisions</text>
    <rect x="164" y="16" width="400" height="30" fill="#0B1020" class="cov0" style="transform:translateX(396px)"/>
    <rect x="164" y="21" width="8" height="20" fill="#F59E0B" class="cur0" style="transform:translateX(396px)"/>
  </g>
  <g class="tl1" style="opacity:0">
    <text x="164" y="38" class="mono" font-size="15" fill="#E6EDF5" textLength="378" lengthAdjust="spacing">bronze → silver → gold, with quality gates</text>
    <rect x="164" y="16" width="382" height="30" fill="#0B1020" class="cov1" style="transform:translateX(378px)"/>
    <rect x="164" y="21" width="8" height="20" fill="#F59E0B" class="cur1" style="transform:translateX(378px)"/>
  </g>
  <g class="tl2" style="opacity:0">
    <text x="164" y="38" class="mono" font-size="15" fill="#E6EDF5" textLength="387" lengthAdjust="spacing">idempotent loads · schemas that fail loudly</text>
    <rect x="164" y="16" width="391" height="30" fill="#0B1020" class="cov2" style="transform:translateX(387px)"/>
    <rect x="164" y="21" width="8" height="20" fill="#F59E0B" class="cur2" style="transform:translateX(387px)"/>
  </g>
  <g class="tl3" style="opacity:0">
    <text x="164" y="38" class="mono" font-size="15" fill="#E6EDF5" textLength="351" lengthAdjust="spacing">honest metrics · documented limitations</text>
    <rect x="164" y="16" width="355" height="30" fill="#0B1020" class="cov3" style="transform:translateX(351px)"/>
    <rect x="164" y="21" width="8" height="20" fill="#F59E0B" class="cur3" style="transform:translateX(351px)"/>
  </g>
  <g class="tl4" style="opacity:0">
    <text x="164" y="38" class="mono" font-size="15" fill="#E6EDF5" textLength="324" lengthAdjust="spacing">batch pipelines, minus the buzzwords</text>
    <rect x="164" y="16" width="328" height="30" fill="#0B1020" class="cov4" style="transform:translateX(324px)"/>
    <rect x="164" y="21" width="8" height="20" fill="#F59E0B" class="cur4" style="transform:translateX(324px)"/>
  </g>

  <!-- compact medallion legend, right-aligned -->
  <g>
    <circle cx="988" cy="32" r="4" fill="#D99245" class="pulse"/>
    <text x="1000" y="36" class="mono" font-size="10" fill="#93A4B7">bronze</text>
    <circle cx="1056" cy="32" r="4" fill="#9CB0C3" class="pulse d1"/>
    <text x="1068" y="36" class="mono" font-size="10" fill="#93A4B7">silver</text>
    <circle cx="1124" cy="32" r="4" fill="#F2C14E" class="pulse d2"/>
    <text x="1136" y="36" class="mono" font-size="10" fill="#93A4B7">gold</text>
  </g>
</svg>
