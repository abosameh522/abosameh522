<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="88" viewBox="0 0 1200 88" role="img" aria-label="Open to data engineering and analyst roles. Contact: abosameh1342005@gmail.com, abobakr-1812.vercel.app, LinkedIn.">
  <defs>
    <linearGradient id="sig" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <style>
      svg{
        --canvas:#0B1020;--surface:#121A2A;--border:#2B3A4F;
        --text:#E6EDF5;--muted:#93A4B7;
        --bronze:#D99245;--silver:#9CB0C3;--gold:#F2C14E;--cyan:#36C5D8;--violet:#A78BFA;
      }
      @media (prefers-color-scheme:light){
        svg{
          --canvas:#F5F8FB;--surface:#FFFFFF;--border:#D3DEE8;
          --text:#172533;--muted:#52687C;
          --bronze:#A75D13;--silver:#637D91;--gold:#946500;--cyan:#007F92;--violet:#6941B6;
        }
      }
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .canvas{fill:var(--canvas)}
      .t{fill:var(--text)}.m{fill:var(--muted)}
      .f-bronze{fill:var(--bronze)}.f-silver{fill:var(--silver)}.f-gold{fill:var(--gold)}
      .f-cyan{fill:var(--cyan)}.s-violet{stroke:var(--violet)}
      @keyframes flow200{to{stroke-dashoffset:-200}}
      @keyframes pulse{0%,100%{opacity:0.9}50%{opacity:0.35}}
      .packet{fill:none;stroke:url(#sig);stroke-width:2.5;stroke-dasharray:9 191;stroke-linecap:round;animation:flow200 4.2s linear infinite}
      .pulse{animation:pulse 3.2s ease-in-out infinite}
      .d1{animation-delay:-1.1s}.d2{animation-delay:-2.1s}
      @media (prefers-reduced-motion:reduce){.packet,.pulse{animation:none}}
    </style>
  </defs>

  <rect width="1200" height="88" rx="14" class="canvas"/>
  <rect width="1200" height="88" rx="14" fill="none" stroke="var(--border)" stroke-width="1.5"/>
  <rect x="0.75" y="0.75" width="1198.5" height="86.5" rx="13.25" fill="none" stroke="var(--border)" stroke-width="0.5" stroke-opacity="0.5"/>

  <!-- CTA + contacts -->
  <rect x="30" y="20" width="3" height="17" rx="1.5" fill="var(--cyan)"/>
  <text x="44" y="34" class="sans t" font-size="15" font-weight="700">Open to data engineering &amp; analyst roles</text>
  <text x="44" y="54" class="mono m" font-size="10">batch pipelines · checked schemas · honest evaluation</text>
  <text x="1170" y="34" text-anchor="end" class="mono t" font-size="10.5">abosameh1342005@gmail.com</text>
  <text x="1170" y="54" text-anchor="end" class="mono m" font-size="10">abobakr-1812.vercel.app · LinkedIn</text>

  <!-- pipeline wave: the visual motif, kept below the copy -->
  <g>
    <path d="M20 74 C 90 63, 170 63, 240 74 C 310 85, 390 85, 460 74 C 530 63, 610 63, 680 74 C 750 85, 830 85, 900 74 C 970 63, 1050 63, 1120 74 C 1145 77, 1163 77, 1180 74"
          fill="none" stroke="url(#sig)" stroke-width="2" stroke-opacity="0.65" stroke-linecap="round"/>
    <path d="M20 74 C 90 63, 170 63, 240 74 C 310 85, 390 85, 460 74 C 530 63, 610 63, 680 74 C 750 85, 830 85, 900 74 C 970 63, 1050 63, 1120 74"
          class="packet"/>
    <circle cx="130" cy="66" r="3.2" class="f-bronze pulse"/>
    <circle cx="590" cy="66" r="3.2" class="f-silver pulse d1"/>
    <circle cx="1010" cy="66" r="3.2" class="f-gold pulse d2"/>
    <polygon points="460,70 464,74 460,78 456,74" fill="var(--canvas)" class="s-violet" stroke-width="1.5"/>
  </g>
</svg>
