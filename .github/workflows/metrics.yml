name: Metrics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  metrics:
    name: Render profile metrics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Render activity and language card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: abosameh522
          filename: metrics.svg
          output_action: none
          template: classic
          config_timezone: Africa/Cairo
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_other: yes
          plugins_errors_fatal: no
          retries: 3
          retries_delay: 120

      - name: Render commit calendar card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: abosameh522
          filename: metrics-isocalendar.svg
          output_action: none
          template: classic
          config_timezone: Africa/Cairo
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugins_errors_fatal: no
          retries: 3
          retries_delay: 120

      - name: Publish the SVGs only when they changed
        run: |
          set -euo pipefail
          sudo cp /metrics_renders/metrics.svg assets/metrics.svg
          sudo cp /metrics_renders/metrics-isocalendar.svg assets/metrics-isocalendar.svg
          sudo chown "$(id -u):$(id -g)" assets/metrics.svg assets/metrics-isocalendar.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/metrics.svg assets/metrics-isocalendar.svg
          if git diff --cached --quiet; then
            echo "Metrics unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore(metrics): refresh profile cards"
          git push
